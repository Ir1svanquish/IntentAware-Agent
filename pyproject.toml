[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentaware-agent"
version = "0.1.0"
description = "IntentAware desktop starter for task continuity and asynchronous delegation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
intentaware = "intentaware.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"intentaware.nlp" = ["prompts/*.md"]
"intentaware.delegation" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
